<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Upload uz Arweave</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            background: #0d1117;
            color: #e6edf3;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
        }
        h1 { 
            font-size: 24px; 
            margin-bottom: 20px;
            color: #79c0ff;
        }
        .drop-zone {
            border: 2px dashed #30363d;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 16px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .drop-zone.dragover {
            border-color: #79c0ff;
            background: rgba(121, 192, 255, 0.1);
        }
        .drop-zone p {
            color: #8b949e;
            font-size: 16px;
            margin: 0;
        }
        .file-list {
            margin-bottom: 16px;
        }
        .file-item {
            padding: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 8px;
            color: #e6edf3;
        }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer;
            background: linear-gradient(135deg, #238636 0%, #1a7f37 50%, #238636 100%);
            color: #fff;
            border: 1px solid rgba(63, 185, 80, 0.3);
            border-radius: 8px;
            width: 100%;
        }
        button:disabled {
            background: #30363d;
            color: #8b949e;
            cursor: not-allowed;
        }
        .status { 
            margin-top: 20px; 
            padding: 10px; 
            word-break: break-all;
            white-space: pre-wrap;
        }
        .success { color: #3fb950; }
        .error { color: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Upload failus uz Arweave</h1>
        
        <div class="drop-zone" id="dropZone">
            <p>📁 Ievelc failus šeit</p>
            <p style="font-size: 12px; margin-top: 8px;">vai noklikšķini, lai izvēlētos</p>
            <input type="file" id="fileInput" multiple accept=".html,.css,.js" style="display: none;">
        </div>
        
        <div class="file-list" id="fileList"></div>
        
        <button id="uploadBtn" disabled>Augšupielādēt un izveidot manifestu</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        let selectedFiles = [];
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const uploadBtn = document.getElementById('uploadBtn');
        
        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            const files = Array.from(e.dataTransfer.files);
            addFiles(files);
        });
        
        fileInput.addEventListener('change', () => {
            const files = Array.from(fileInput.files);
            addFiles(files);
        });
        
        function addFiles(files) {
            selectedFiles = [...selectedFiles, ...files];
            updateFileList();
        }
        
        function updateFileList() {
            fileList.innerHTML = '';
            
            if (selectedFiles.length === 0) {
                uploadBtn.disabled = true;
                return;
            }
            
            selectedFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = '📄 ' + file.name + ' (' + formatBytes(file.size) + ') ' +
                    '<button onclick="removeFile(' + index + ')" style="width: auto; padding: 4px 8px; margin: 0; background: #f85149; border: none; border-radius: 4px; cursor: pointer;">✕</button>';
                fileList.appendChild(div);
            });
            
            uploadBtn.disabled = false;
        }
        
        window.removeFile = function(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        };
        
        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }
        
        uploadBtn.addEventListener('click', async function() {
            if (selectedFiles.length === 0) return;
            
            const statusEl = document.getElementById('status');
            const button = uploadBtn;
            
            button.disabled = true;
            statusEl.textContent = '⏳ Augšupielādē ' + selectedFiles.length + ' failus...';
            statusEl.className = 'status';
            
            try {
                const uploadResults = [];
                
                // 1. Augšupielādē visus failus
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    statusEl.textContent = '⏳ Augšupielādē ' + (i + 1) + '/' + selectedFiles.length + ': ' + file.name + '...';
                    
                    const fileBuffer = await file.arrayBuffer();
                    const base64 = btoa(String.fromCharCode(...new Uint8Array(fileBuffer)));
                    
                    const response = await fetch('/api/upload-restore', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            fileName: file.name,
                            fileContent: base64 
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        uploadResults.push({ name: file.name, txId: result.txId });
                    } else {
                        throw new Error(result.error || 'Kļūda ar ' + file.name);
                    }
                }
                
                // 2. Izveido manifestu
                statusEl.textContent = '📦 Veido manifestu...';
                
                const manifest = {
                    manifest: 'arweave/paths',
                    version: '0.1.0',
                    index: { path: 'restore.html' },
                    paths: {}
                };
                
                for (const r of uploadResults) {
                    manifest.paths[r.name] = { id: r.txId };
                }
                
                const manifestBuffer = new TextEncoder().encode(JSON.stringify(manifest));
                const manifestBase64 = btoa(String.fromCharCode(...manifestBuffer));
                
                const manifestResponse = await fetch('/api/upload-restore', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        fileName: 'manifest.json',
                        fileContent: manifestBase64 
                    })
                });
                
                const manifestResult = await manifestResponse.json();
                
                if (!manifestResult.success) {
                    throw new Error(manifestResult.error || 'Manifesta kļūda');
                }
                
                let resultText = '✅ Augšupielādēti faili:\n\n';
                for (const r of uploadResults) {
                    resultText += '📄 ' + r.name + '\n' + r.txId + '\n\n';
                }
                
                resultText += '📦 MANIFEST TX ID: ' + manifestResult.txId + '\n\n';
                resultText += '🌐 URL: https://ar-io.dev/' + manifestResult.txId;
                
                statusEl.textContent = resultText;
                statusEl.className = 'status success';
                
                selectedFiles = [];
                updateFileList();
                
            } catch (e) {
                console.error('Kļūda:', e);
                statusEl.textContent = '❌ ' + e.message;
                statusEl.className = 'status error';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
