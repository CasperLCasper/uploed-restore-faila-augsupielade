<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Upload uz Arweave</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 20px; 
            background: #0d1117;
            color: #e6edf3;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
        }
        h1 { 
            font-size: 24px; 
            margin-bottom: 20px;
            color: #79c0ff;
        }
        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #e6edf3;
            margin-bottom: 16px;
        }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer;
            background: linear-gradient(135deg, #238636 0%, #1a7f37 50%, #238636 100%);
            color: #fff;
            border: 1px solid rgba(63, 185, 80, 0.3);
            border-radius: 8px;
            width: 100%;
        }
        button:disabled {
            background: #30363d;
            color: #8b949e;
            cursor: not-allowed;
        }
        .status { 
            margin-top: 20px; 
            padding: 10px; 
            word-break: break-all;
        }
        .success { color: #3fb950; }
        .error { color: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Upload vairākus failus uz Arweave</h1>
        
        <input type="file" id="fileInput" multiple accept=".html,.css,.js">
        
        <button id="uploadBtn">Augšupielādēt visus un izveidot manifestu</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        document.getElementById('uploadBtn').addEventListener('click', async function() {
            const statusEl = document.getElementById('status');
            const button = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('fileInput');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                statusEl.textContent = '❌ Izvēlies failus!';
                statusEl.className = 'status error';
                return;
            }
            
            const files = Array.from(fileInput.files);
            
            button.disabled = true;
            statusEl.textContent = '⏳ Augšupielādē ' + files.length + ' failus...';
            statusEl.className = 'status';
            
            try {
                const uploadResults = [];
                
                // 1. Augšupielādē visus failus
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    statusEl.textContent = '⏳ Augšupielādē ' + (i + 1) + '/' + files.length + ': ' + file.name + '...';
                    
                    const fileBuffer = await file.arrayBuffer();
                    const base64 = btoa(String.fromCharCode(...new Uint8Array(fileBuffer)));
                    
                    const response = await fetch('/api/upload-restore', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            fileName: file.name,
                            fileContent: base64 
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        uploadResults.push({ name: file.name, txId: result.txId });
                    } else {
                        throw new Error(result.error || 'Kļūda ar ' + file.name);
                    }
                }
                
                // 2. Izveido manifestu
                statusEl.textContent = '📦 Veido manifestu...';
                
                const manifest = {
                    manifest: 'arweave/paths',
                    version: '0.1.0',
                    index: { path: 'restore.html' },
                    paths: {}
                };
                
                for (const r of uploadResults) {
                    manifest.paths[r.name] = { id: r.txId };
                }
                
                const manifestBuffer = new TextEncoder().encode(JSON.stringify(manifest));
                const manifestBase64 = btoa(String.fromCharCode(...manifestBuffer));
                
                const manifestResponse = await fetch('/api/upload-restore', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        fileName: 'manifest.json',
                        fileContent: manifestBase64 
                    })
                });
                
                const manifestResult = await manifestResponse.json();
                
                if (!manifestResult.success) {
                    throw new Error(manifestResult.error || 'Manifesta kļūda');
                }
                
                let resultText = '✅ Augšupielādēti faili:\n\n';
                for (const r of uploadResults) {
                    resultText += '📄 ' + r.name + '\n' + r.txId + '\n\n';
                }
                
                resultText += '📦 MANIFEST TX ID: ' + manifestResult.txId + '\n\n';
                resultText += '🌐 URL: https://ar-io.dev/' + manifestResult.txId;
                
                statusEl.textContent = resultText;
                statusEl.className = 'status success';
                
            } catch (e) {
                console.error('Kļūda:', e);
                statusEl.textContent = '❌ ' + e.message;
                statusEl.className = 'status error';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
