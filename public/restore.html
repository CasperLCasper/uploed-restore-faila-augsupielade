<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo — Atjaunošana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="language-selector">
            <button class="lang-btn" data-lang="lv">LV</button>
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="eo">EO</button>
        </div>
        
        <h1 data-i18n="restore-title">🔓 PermRepo Atjaunošana</h1>
        <p class="subtitle" data-i18n="restore-subtitle">Atjauno GitHub repo no Arweave — bez servera!</p>
        
        <div class="info-row">
            <span class="info-label" data-i18n="wallet-label">Savienotais maks</span>
            <span class="info-value" id="walletStatus" data-i18n="wallet-not-connected">Nav savienots</span>
        </div>
        <button id="connectWalletBtn" data-i18n="connect-wallet">🔌 Savienot maku</button>
        
        <div id="manifestSection" style="display: none;">
            <div class="info-row">
                <span class="info-label" data-i18n="manifest-label">Arweave manifests (TX ID vai ar://)</span>
            </div>
            <input type="text" id="manifestInput" data-i18n-placeholder="manifest-placeholder" placeholder="ar://ABC123... vai https://ar-io.dev/raw/ABC123...">
            
            <button id="verifyBtn" data-i18n="verify-nft">Pārbaudīt NFT īpašumtiesības</button>
        </div>
        
        <div id="nftVerificationSection" style="display: none;">
            <div id="nftVerificationStatus" class="status"></div>
        </div>
        
        <div id="masterKeySection" style="display: none;">
            <div class="info-row">
                <span class="info-label" data-i18n="master-key-label">Master atslēga</span>
            </div>
            <textarea id="masterKeyInput" data-i18n-placeholder="master-key-placeholder" placeholder="Ievadi savu master atslēgu..."></textarea>
            
            <button id="restoreBtn" data-i18n="restore-btn">📥 Atjaunot repozitoriju</button>
        </div>
        
        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
        
        <div id="status" class="status"></div>
        <div id="debugInfo" class="debug-info"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
    <script src="restore.js"></script>
</body>
</html>
